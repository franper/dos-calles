<style>
:root{
  --bg:#F2F3F5;
  --card:#FFFFFF;
  --card-2:#EAECEF;
  --ink:#12161A;
  --ink-2:#5A646E;
  --ink-3:#8E98A3;
  --line:#DFE3E8;
  --line-2:#EDEFF2;
  --teal:#0D6E78;
  --teal-soft:#DCEBEC;
  --plum:#6B3A5B;
  --plum-soft:#EEDFE9;
  --good:#1F6B4A;
  --warn:#8A5A12;
  --tabbar:rgba(255,255,255,.92);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --accent:var(--teal);
  --accent-soft:var(--teal-soft);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E11;
    --card:#161B20;
    --card-2:#1F262D;
    --ink:#E8ECF0;
    --ink-2:#A0AAB5;
    --ink-3:#6E7883;
    --line:#252D35;
    --line-2:#1C232A;
    --teal:#4FB4BE;
    --teal-soft:#10333A;
    --plum:#CE97BA;
    --plum-soft:#33202C;
    --good:#5BB98B;
    --warn:#D5A45C;
    --tabbar:rgba(22,27,32,.92);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E11;--card:#161B20;--card-2:#1F262D;--ink:#E8ECF0;--ink-2:#A0AAB5;--ink-3:#6E7883;
  --line:#252D35;--line-2:#1C232A;--teal:#4FB4BE;--teal-soft:#10333A;--plum:#CE97BA;--plum-soft:#33202C;
  --good:#5BB98B;--warn:#D5A45C;--tabbar:rgba(22,27,32,.92);
}
[data-accent="plum"]{--accent:var(--plum);--accent-soft:var(--plum-soft)}
[data-accent="teal"]{--accent:var(--teal);--accent-soft:var(--teal-soft)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

.app{max-width:34rem;margin:0 auto;padding:0 0 calc(5.2rem + env(safe-area-inset-bottom,0px))}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card-2);border-radius:9px;padding:2px}
.seg button{background:none;border:0;border-radius:7px;padding:.42rem .3rem;font-size:.85rem;font-weight:600;color:var(--ink-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.1)}
h1{font-size:1.85rem;font-weight:800;letter-spacing:-.025em;margin:.75rem 0 0}
.sub{color:var(--ink-3);font-size:.83rem;margin:.1rem 0 0}

main{padding:1rem 1rem 0}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.85rem}
.card.flat{background:none;border:0;padding:0}
.ctitle{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .6rem}
h2{font-size:1.12rem;font-weight:700;letter-spacing:-.01em;margin:0}
.muted{color:var(--ink-2);font-size:.87rem}
.tiny{color:var(--ink-3);font-size:.76rem;line-height:1.45}

/* ---- today hero ---- */
.hero-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .45rem;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.hero-name{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin:.55rem 0 .15rem;text-wrap:balance}

/* ---- blocks ---- */
ul.blocks{list-style:none;margin:.7rem 0 0;padding:0}
ul.blocks li{display:grid;grid-template-columns:1fr auto;gap:.6rem;padding:.5rem 0;border-top:1px solid var(--line-2);align-items:baseline}
ul.blocks li:first-child{border-top:0}
.bk-n{font-size:.9rem;font-weight:600}
.bk-d{color:var(--ink-2);font-size:.8rem;margin-top:.05rem}
.bk-r{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.eq{display:inline-block;font-size:.63rem;font-weight:700;letter-spacing:.03em;padding:.1rem .3rem;border-radius:4px;margin-left:.3rem;vertical-align:1px}
.eq.f{background:var(--teal-soft);color:var(--teal)}
.eq.p{background:var(--plum-soft);color:var(--plum)}

/* ---- log form ---- */
.frow{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line-2)}
.frow:first-of-type{border-top:0}
.flab{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:.55rem}
.stepper button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--card-2);font-size:1.15rem;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.stepper .val{font-family:var(--mono);font-size:1rem;font-weight:600;min-width:4.1rem;text-align:center;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:.35rem;justify-content:flex-end;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:.3rem .68rem;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .pills button[aria-pressed="true"],
:root:not([data-theme="light"]) .pills button[aria-pressed="true"]{color:#0B0E11}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .pills button[aria-pressed="true"]{color:#fff}}

.kcal-line{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line-2)}
.kcal-num{font-family:var(--mono);font-size:1.9rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kcal-unit{font-size:.8rem;color:var(--ink-3);font-family:var(--sys);font-weight:600;margin-left:.2rem}

.btn{width:100%;border:0;border-radius:12px;padding:.85rem 1rem;font-size:1rem;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;margin-top:.85rem}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0B0E11}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn.ghost{background:var(--card-2);color:var(--ink-2);font-weight:600}
.btn.done{background:var(--card-2);color:var(--good)}
.btn:active{opacity:.75}

/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.85rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .6rem;text-align:center}
.stat .v{font-family:var(--mono);font-size:1.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
.stat .k{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:.15rem;display:block}

/* ---- charts ---- */
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:10px;font-family:var(--sys)}
.chart .bar{fill:var(--accent)}
.chart .bar.empty{fill:var(--card-2)}
.chart .lbl{fill:var(--ink-2);font-size:10px;font-family:var(--mono);font-weight:600}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.55rem;font-size:.78rem;color:var(--ink-3);min-height:1.2rem}
.readout b{color:var(--ink);font-family:var(--mono);font-weight:700}

/* ---- plan list ---- */
.day{margin-bottom:.85rem}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:0 0 .4rem;padding:0 .15rem}
.day-n{font-size:.95rem;font-weight:800;letter-spacing:-.01em}
.day-m{font-size:.72rem;color:var(--ink-3);font-family:var(--mono)}
details.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:.4rem;overflow:hidden}
details.sess summary{list-style:none;cursor:pointer;padding:.75rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
details.sess summary::-webkit-details-marker{display:none}
.ss-name{font-size:.92rem;font-weight:600}
.ss-meta{font-size:.73rem;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
details.sess[open] summary{border-bottom:1px solid var(--line-2)}
.sess-body{padding:.3rem .9rem .85rem}

/* ---- profile form ---- */
.field{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line-2)}
.field:first-of-type{border-top:0}
.field label{font-size:.88rem;color:var(--ink-2)}
.field input,.field select{width:7.5rem;text-align:right;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.field input[type="text"]{font-family:var(--sys);text-align:right}
.field select{font-family:var(--sys);text-align:left}

/* ---- tab bar ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:.5rem .2rem .55rem;display:flex;flex-direction:column;align-items:center;gap:.18rem;cursor:pointer;color:var(--ink-3)}
.tabs button[aria-pressed="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs span{font-size:.63rem;font-weight:600;letter-spacing:.01em}

.banner{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font-size:.78rem;color:var(--ink-2);margin-bottom:.85rem;line-height:1.45}
.empty{text-align:center;color:var(--ink-3);font-size:.85rem;padding:1.6rem .8rem}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>


</head>

var DAYN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DAYS=['D','L','M','X','J','V','S'];
var EFFORT={suave:{m:0.85,l:'Suave'},normal:{m:1,l:'Normal'},fuerte:{m:1.15,l:'Fuerte'}};

var DEFAULTS={
  a:{name:'Isra',heightCm:178,weightKg:80,accent:'teal'},
  b:{name:'Ella',heightCm:165,weightKg:57,accent:'plum'}
};

/* ============================ HELPERS ============================ */
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);}
function today(){return iso(new Date());}
function parseISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function mondayOf(d){var x=new Date(d.getTime());var w=(x.getDay()+6)%7;return addDays(x,-w);}
function kcalOf(met,kg,min,eff){return Math.round(met*(EFFORT[eff]||EFFORT.normal).m*kg*(min/60));}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v,f){v=parseFloat(v);return isFinite(v)?v:f;}

/* ============================ STORAGE ============================ */
var LK='doscalles-v1';
function localData(){try{return JSON.parse(localStorage.getItem(LK)||'{}')||{};}catch(e){return {};}}
function localSave(d){try{localStorage.setItem(LK,JSON.stringify(d));}catch(e){}}

function LocalStore(){
  var subs={profiles:[],logs:[],weights:[]};
  function d(){var x=localData();x.profiles=x.profiles||{};x.logs=x.logs||{};x.weights=x.weights||{};return x;}
  function emit(k){var x=d();var v=k==='profiles'?x.profiles:Object.keys(x[k]).map(function(id){var o=x[k][id];o.id=id;return o;});
    subs[k].forEach(function(f){f(v);});}
  return {
    kind:'local',
    watch:function(k,cb){subs[k].push(cb);setTimeout(function(){emit(k);},0);},
    saveProfile:function(id,obj){var x=d();x.profiles[id]=obj;localSave(x);emit('profiles');},
    setLog:function(l){var x=d();x.logs[l.id]=l;localSave(x);emit('logs');},
    delLog:function(id){var x=d();delete x.logs[id];localSave(x);emit('logs');},
    setWeight:function(w){var x=d();x.weights[w.id]=w;localSave(x);emit('weights');}
  };
}

/* ---- copia de seguridad ---- */
function exportBackup(){
  var d=localData();
  d._app='dos-calles';d._v=1;d._exported=new Date().toISOString();
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='dos-calles-'+today()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}
function importBackup(file,done){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||d._app!=='dos-calles')throw new Error('formato');
      var cur=localData();
      cur.profiles=Object.assign({},cur.profiles||{},d.profiles||{});
      cur.logs=Object.assign({},cur.logs||{},d.logs||{});
      cur.weights=Object.assign({},cur.weights||{},d.weights||{});
      localSave(cur);
      done(null,Object.keys(d.logs||{}).length);
    }catch(e){done(e);}
  };
  r.onerror=function(){done(new Error('lectura'));};
  r.readAsText(file);
}

var S={
  tab:'hoy',
  active:'a',
  profiles:{a:Object.assign({},DEFAULTS.a),b:Object.assign({},DEFAULTS.b)},
  logs:[],
  weights:[],
  form:{},
  synced:false,
  store:LocalStore()
};
try{var pref=localStorage.getItem(LK+'-me');if(pref==='a'||pref==='b')S.active=pref;}catch(e){}

function prof(){return S.profiles[S.active]||DEFAULTS[S.active];}
function sessionsFor(p,dayIdx){return (PLAN[p]&&PLAN[p][dayIdx])||[];}
function logId(p,date,k){return p+'__'+date+'__'+k;}
function findLog(p,date,k){var id=logId(p,date,k);for(var i=0;i<S.logs.length;i++)if(S.logs[i].id===id)return S.logs[i];return null;}
function logsOf(p){return S.logs.filter(function(l){return l.profile===p;});}
function weightsOf(p){return S.weights.filter(function(w){return w.profile===p;}).sort(function(x,y){return x.date<y.date?-1:1;});}

/* ---------- HOY ---------- */
function viewHoy(){
  var d=new Date(),dayIdx=d.getDay(),date=today();
  var list=sessionsFor(S.active,dayIdx);
  titleEl.textContent='Hoy';
  subEl.textContent=DAYN[dayIdx]+' · '+d.getDate()+'/'+(d.getMonth()+1);

  if(!list.length){
    var next=1;while(next<8&&!sessionsFor(S.active,(dayIdx+next)%7).length)next++;
    var nd=(dayIdx+next)%7;
    return syncBanner()+'<div class="card"><div class="hero-tag">Descanso</div>'+
      '<div class="hero-name">Hoy no toca</div>'+
      '<p class="muted">Día libre. La próxima sesión es el '+DAYN[nd].toLowerCase()+
      (sessionsFor(S.active,nd)[0]?': '+esc(sessionsFor(S.active,nd)[0].n).toLowerCase():'')+'.</p></div>'+
      weightCard();
  }

  return syncBanner()+list.map(function(s){return sessionCard(s,date);}).join('')+weightCard();

function sessionCard(s,date){
  var existing=findLog(S.active,date,s.k);
  var f=S.form[s.k]||(S.form[s.k]={min:existing?existing.minutes:s.min,eff:existing?existing.effort:'normal'});
  var kg=num(prof().weightKg,70);
  var kc=kcalOf(s.met,kg,f.min,f.eff);
  var eff=['suave','normal','fuerte'].map(function(e){
    return '<button type="button" data-eff="'+e+'" data-k="'+s.k+'" aria-pressed="'+(f.eff===e)+'">'+EFFORT[e].l+'</button>';
  }).join('');
  return '<div class="card">'+
    '<div class="hero-tag">'+(s.kind==='pool'?'Piscina':'Esterilla')+'</div>'+
    '<div class="hero-name">'+esc(s.n)+'</div>'+
    '<p class="muted">'+esc(s.dist)+' · unos '+s.min+' min</p>'+
    blocksHTML(s.bl)+
    '<div style="margin-top:1rem">'+
      '<div class="frow"><span class="flab">Minutos</span><div class="stepper">'+
        '<button type="button" data-min="-5" data-k="'+s.k+'" aria-label="Menos 5 minutos">−</button>'+
        '<span class="val">'+f.min+' min</span>'+
        '<button type="button" data-min="5" data-k="'+s.k+'" aria-label="Más 5 minutos">+</button></div></div>'+
      '<div class="frow"><span class="flab">Esfuerzo</span><div class="pills">'+eff+'</div></div>'+
    '</div>'+
    '<div class="kcal-line"><span class="muted">Gasto estimado</span>'+
      '<span><span class="kcal-num">'+kc+'</span><span class="kcal-unit">kcal</span></span></div>'+
    (existing
      ? '<button class="btn done" type="button" data-undo="'+s.k+'">✓ Registrada · toca para deshacer</button>'
      : '<button class="btn" type="button" data-save="'+s.k+'">Registrar sesión</button>')+
    '</div>';
}

function weightBase(){
  var ws=weightsOf(S.active),last=ws.length?ws[ws.length-1]:null,t=today(),todayW=null;
  for(var i=0;i<ws.length;i++)if(ws[i].date===t)todayW=ws[i];
  return {todayW:todayW,kg:todayW?todayW.kg:(last?last.kg:num(prof().weightKg,70))};
}
function weightCard(){
  var wb=weightBase(),todayW=wb.todayW;
  var cur=S.pendingW!=null?S.pendingW:wb.kg;
  return '<div class="card"><p class="ctitle">Peso de hoy</p>'+
    '<div class="frow"><span class="flab">Kilos</span><div class="stepper">'+
      '<button type="button" data-wt="-0.1" aria-label="Menos 100 gramos">−</button>'+
      '<span class="val">'+cur.toFixed(1)+' kg</span>'+
      '<button type="button" data-wt="0.1" aria-label="Más 100 gramos">+</button></div></div>'+
    '<button class="btn ghost" type="button" data-savew="1">'+(todayW?'Actualizar peso de hoy':'Guardar peso de hoy')+'</button>'+
    '</div>';
}

/* ---------- PROGRESO ---------- */
function viewProg(){
  titleEl.textContent='Progreso';
  subEl.textContent=esc(prof().name||'');
  var ls=logsOf(S.active);
  var mon=mondayOf(new Date()),days=[],total=0,count=0;
  for(var i=0;i<7;i++){
    var dt=iso(addDays(mon,i)),k=0;
    ls.forEach(function(l){if(l.date===dt){k+=l.kcal||0;count++;}});
    days.push({d:dt,label:DAYS[addDays(mon,i).getDay()],k:k});
    total+=k;
  }
  var streak=streakOf(ls);
  var weeks=weeklyTotals(ls,8);

  return '<div class="stats">'+
      '<div class="stat"><span class="v">'+count+'</span><span class="k">sesiones</span></div>'+
      '<div class="stat"><span class="v">'+total+'</span><span class="k">kcal semana</span></div>'+
      '<div class="stat"><span class="v">'+streak+'</span><span class="k">semanas seguidas</span></div>'+
    '</div>'+
    '<div class="card"><p class="ctitle">Esta semana</p>'+barChart(days)+
      '<div class="readout" id="ro1"><span>Toca una barra para ver el detalle</span></div></div>'+
    '<div class="card"><p class="ctitle">Últimas 8 semanas</p>'+barChart(weeks)+
      '<div class="readout" id="ro2"><span>Total por semana</span></div></div>'+
    weightChart()+
    '<div class="card"><p class="ctitle">Historial</p>'+historyHTML(ls)+'</div>';
}

function weeklyTotals(ls,n){
  var mon=mondayOf(new Date()),out=[];
  for(var w=n-1;w>=0;w--){
    var start=addDays(mon,-7*w),end=addDays(start,6);
    var a=iso(start),bb=iso(end),k=0;
    ls.forEach(function(l){if(l.date>=a&&l.date<=bb)k+=l.kcal||0;});
    out.push({d:a,label:(start.getDate())+'/'+(start.getMonth()+1),k:k});
  }
  return out;
}

function streakOf(ls){
  var mon=mondayOf(new Date()),s=0,started=false;
  for(var w=0;w<60;w++){
    var start=addDays(mon,-7*w),a=iso(start),bb=iso(addDays(start,6)),any=false;
    for(var i=0;i<ls.length;i++){if(ls[i].date>=a&&ls[i].date<=bb){any=true;break;}}
    if(any){s++;started=true;}
    else if(w===0&&!started){continue;}
    else{break;}
  }
  return s;
}

function barChart(rows){
  var W=320,H=118,padB=20,padT=14,max=0;
  rows.forEach(function(r){if(r.k>max)max=r.k;});
  var scale=max>0?max:1;
  var n=rows.length,gap=6,bw=(W-(n-1)*gap)/n;
  var bars='',labels='';
  rows.forEach(function(r,i){
    var h=r.k>0?Math.max(4,(H-padB-padT)*(r.k/scale)):3;
    var x=i*(bw+gap),y=H-padB-h;
    bars+='<rect class="bar'+(r.k>0?'':' empty')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+h.toFixed(1)+'" rx="4" data-i="'+i+'" data-k="'+r.k+'" data-l="'+esc(r.label)+'"></rect>';
    labels+='<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  var top=max>0?'<text class="lbl" x="0" y="10">máx '+max+' kcal</text>':'';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto estimado por periodo">'+
    top+'<line class="grid" x1="0" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'"/>'+bars+labels+'</svg>';
}

function weightChart(){
  var ws=weightsOf(S.active);
  if(ws.length<2){
    return '<div class="card"><p class="ctitle">Peso</p><div class="empty">Guarda el peso al menos dos días para ver la línea.</div></div>';
  }
  var pts=ws.slice(-30),W=320,H=110,padT=12,padB=16,padL=48,padR=8;
  var mn=Infinity,mx=-Infinity;
  pts.forEach(function(p){if(p.kg<mn)mn=p.kg;if(p.kg>mx)mx=p.kg;});
  if(mx-mn<1){mn-=0.5;mx+=0.5;}
  var span=mx-mn;
  function X(i){return padL+(W-padL-padR)*(pts.length>1?i/(pts.length-1):0);}
  function Y(v){return padT+(H-padT-padB)*(1-(v-mn)/span);}
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.kg).toFixed(1);}).join(' ');
  var last=pts[pts.length-1],first=pts[0];
  var dots='<circle class="pt" cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(last.kg).toFixed(1)+'" r="4.5"/>';
  var diff=(last.kg-first.kg);
  return '<div class="card"><p class="ctitle">Peso · últimos '+pts.length+' registros</p>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">'+
      '<line class="grid" x1="'+padL+'" y1="'+padT+'" x2="'+(W-padR)+'" y2="'+padT+'"/>'+
      '<line class="grid" x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'"/>'+
      '<text class="lbl" x="0" y="'+(padT+4)+'">'+mx.toFixed(1)+' kg</text>'+
      '<text class="lbl" x="0" y="'+(H-padB+4)+'">'+mn.toFixed(1)+' kg</text>'+
      '<path class="ln" d="'+d+'"/>'+dots+'</svg>'+
    '<div class="readout"><span>'+esc(first.date)+' → '+esc(last.date)+'</span>'+
      '<b>'+(diff>0?'+':'')+diff.toFixed(1)+' kg</b></div></div>';
}

function historyHTML(ls){
  var sorted=ls.slice().sort(function(x,y){return x.date<y.date?1:(x.date>y.date?-1:0);}).slice(0,12);
  if(!sorted.length)return '<div class="empty">Todavía no hay sesiones registradas.</div>';
  return '<ul class="blocks">'+sorted.map(function(l){
    return '<li><div><div class="bk-n">'+esc(l.name||'')+'</div>'+
      '<div class="bk-d">'+esc(l.date)+' · '+l.minutes+' min · '+esc((EFFORT[l.effort]||EFFORT.normal).l.toLowerCase())+'</div></div>'+
      '<div class="bk-r">'+(l.kcal||0)+' kcal</div></li>';
  }).join('')+'</ul>';
}

    '<div class="card"><p class="ctitle">Cómo se calculan las calorías</p>'+

document.getElementById('tabbar').addEventListener('click',function(e){

view.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var k;

  if((k=t.getAttribute('data-min'))!==null&&k!==undefined){
    var key=t.getAttribute('data-k'),f=S.form[key];
    if(f){f.min=Math.max(10,Math.min(180,f.min+parseInt(k,10)));render();}
    return;
  }
  if((k=t.getAttribute('data-eff'))){
    var key2=t.getAttribute('data-k');if(S.form[key2]){S.form[key2].eff=k;render();}
    return;
  }
  if((k=t.getAttribute('data-save'))){
    var s=findSession(k);if(!s)return;
    var f2=S.form[k]||{min:s.min,eff:'normal'};
    var kg=num(prof().weightKg,70);
    S.store.setLog({id:logId(S.active,today(),k),profile:S.active,date:today(),key:k,
      name:s.n,kind:s.kind,minutes:f2.min,effort:f2.eff,kcal:kcalOf(s.met,kg,f2.min,f2.eff),weightKg:kg,ts:Date.now()});
    return;
  }
  if((k=t.getAttribute('data-undo'))){S.store.delLog(logId(S.active,today(),k));return;}

  if((k=t.getAttribute('data-wt'))){
    var base=S.pendingW!=null?S.pendingW:weightBase().kg;
    S.pendingW=Math.round(Math.max(30,Math.min(250,base+parseFloat(k)))*10)/10;
    render();
    return;
  }
  if(t.getAttribute('data-savew')){
    var kgv=Math.round((S.pendingW!=null?S.pendingW:weightBase().kg)*10)/10;
    S.store.setWeight({id:S.active+'__'+today(),profile:S.active,date:today(),kg:kgv,ts:Date.now()});
    var pr=Object.assign({},prof());pr.weightKg=kgv;S.profiles[S.active]=pr;S.store.saveProfile(S.active,pr);
    S.pendingW=null;
    return;
  }
  if(t.getAttribute('data-export')){exportBackup();
    var m0=document.getElementById('ioMsg');if(m0)m0.textContent='Copia generada. Guárdala en Archivos o iCloud Drive.';
    return;}
  if(t.getAttribute('data-import')){
    var fi=document.getElementById('fileIn');if(!fi)return;
    fi.onchange=function(){
      if(!fi.files||!fi.files[0])return;
      importBackup(fi.files[0],function(err,n){
        var m=document.getElementById('ioMsg');
        if(err){if(m)m.textContent='No se pudo leer el fichero. ¿Es una copia de esta app?';return;}
        S.store=LocalStore();attach(S.store);
        var m2=document.getElementById('ioMsg');
        if(m2)m2.textContent='Restauradas '+n+' sesiones.';
      });
    };
    fi.click();
    return;}
  if(t.getAttribute('data-saveprofile')){
    var pr2=Object.assign({},prof());
    pr2.name=(document.getElementById('fName').value||'').trim().slice(0,18)||DEFAULTS[S.active].name;
    pr2.heightCm=Math.round(Math.max(120,Math.min(230,num(document.getElementById('fH').value,170))));
    pr2.weightKg=Math.round(Math.max(30,Math.min(250,num(document.getElementById('fW').value,70)))*10)/10;
    pr2.accent=document.getElementById('fA').value==='plum'?'plum':'teal';
    S.profiles[S.active]=pr2;S.store.saveProfile(S.active,pr2);render();
    return;
  }
});

function findSession(k){
  var out=null;
  ['a','b'].forEach(function(p){
    Object.keys(PLAN[p]).forEach(function(d){
      PLAN[p][d].forEach(function(s){if(s.k===k)out=s;});
    });
  });
  return out;
}

/* ============================ BOOT ============================ */
var TOKEN=0;
function attach(store){
  var mine=++TOKEN;
  S.store=store;
  S.synced=(store.kind==='db');
  store.watch('profiles',function(v){
    if(mine!==TOKEN)return;
    ['a','b'].forEach(function(id){ if(v&&v[id]) S.profiles[id]=Object.assign({},DEFAULTS[id],v[id]); });
    render();
  });
  store.watch('logs',function(v){if(mine!==TOKEN)return;S.logs=v||[];render();});
  store.watch('weights',function(v){if(mine!==TOKEN)return;S.weights=v||[];render();});
}

render();
attach(LocalStore());

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
