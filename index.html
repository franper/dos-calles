<title>Dos Calles</title>
<style>
:root{
  --bg:#F2F3F5;--card:#FFFFFF;--card-2:#EAECEF;--ink:#12161A;--ink-2:#5A646E;--ink-3:#8E98A3;
  --line:#DFE3E8;--line-2:#EDEFF2;--teal:#0D6E78;--teal-soft:#DCEBEC;--plum:#6B3A5B;--plum-soft:#EEDFE9;
  --good:#1F6B4A;--danger:#A3342A;--tabbar:rgba(255,255,255,.92);--sheet:#FFFFFF;--scrim:rgba(10,14,17,.42);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --accent:var(--teal);--accent-soft:var(--teal-soft);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E11;--card:#161B20;--card-2:#1F262D;--ink:#E8ECF0;--ink-2:#A0AAB5;--ink-3:#6E7883;
    --line:#252D35;--line-2:#1C232A;--teal:#4FB4BE;--teal-soft:#10333A;--plum:#CE97BA;--plum-soft:#33202C;
    --good:#5BB98B;--danger:#E88379;--tabbar:rgba(22,27,32,.92);--sheet:#161B20;--scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E11;--card:#161B20;--card-2:#1F262D;--ink:#E8ECF0;--ink-2:#A0AAB5;--ink-3:#6E7883;
  --line:#252D35;--line-2:#1C232A;--teal:#4FB4BE;--teal-soft:#10333A;--plum:#CE97BA;--plum-soft:#33202C;
  --good:#5BB98B;--danger:#E88379;--tabbar:rgba(22,27,32,.92);--sheet:#161B20;--scrim:rgba(0,0,0,.6);
}
[data-accent="plum"]{--accent:var(--plum);--accent-soft:var(--plum-soft)}
[data-accent="teal"]{--accent:var(--teal);--accent-soft:var(--teal-soft)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sys);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:34rem;margin:0 auto;padding:0 0 calc(5.4rem + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:.9rem 1rem .6rem;border-bottom:1px solid var(--line-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card-2);border-radius:9px;padding:2px}
.seg button{background:none;border:0;border-radius:7px;padding:.42rem .3rem;font-size:.85rem;font-weight:600;color:var(--ink-2);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.1)}
h1{font-size:1.85rem;font-weight:800;letter-spacing:-.025em;margin:.75rem 0 0}
.sub{color:var(--ink-3);font-size:.83rem;margin:.1rem 0 0}
main{padding:1rem 1rem 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.85rem}
.ctitle{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 .6rem}
.muted{color:var(--ink-2);font-size:.87rem}
.tiny{color:var(--ink-3);font-size:.76rem;line-height:1.45}
.hero-tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.22rem .45rem;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.hero-name{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin:.55rem 0 .15rem;text-wrap:balance}

/* exercise rows */
ul.ex{list-style:none;margin:.7rem 0 0;padding:0}
ul.ex li{border-top:1px solid var(--line-2)}
ul.ex li:first-child{border-top:0}
.exrow{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:.55rem;align-items:center;background:none;border:0;padding:.6rem .1rem;text-align:left;cursor:pointer}
.exrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ex-n{font-size:.91rem;font-weight:600;line-height:1.3}
.ex-d{color:var(--ink-2);font-size:.79rem;margin-top:.08rem;line-height:1.35}
.ex-r{font-family:var(--mono);font-size:.74rem;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;stroke:var(--ink-3);stroke-width:2;fill:none;flex:none}
.eq{display:inline-block;font-size:.62rem;font-weight:700;padding:.1rem .3rem;border-radius:4px;margin-left:.32rem;vertical-align:1px}
.eq.f{background:var(--teal-soft);color:var(--teal)}
.eq.p{background:var(--plum-soft);color:var(--plum)}

.frow{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line-2)}
.flab{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:.55rem}
.stepper button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--card-2);font-size:1.15rem;font-weight:600;line-height:1;cursor:pointer;display:grid;place-items:center}
.stepper .val{font-family:var(--mono);font-size:1rem;font-weight:600;min-width:4.1rem;text-align:center;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:.35rem;justify-content:flex-end;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:.3rem .68rem;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.kcal-line{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line-2)}
.kcal-num{font-family:var(--mono);font-size:1.9rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kcal-unit{font-size:.8rem;color:var(--ink-3);font-weight:600;margin-left:.2rem}

.btn{width:100%;border:0;border-radius:12px;padding:.82rem 1rem;font-size:1rem;font-weight:700;background:var(--accent);color:var(--card);cursor:pointer;margin-top:.7rem}
.btn.ghost{background:var(--card-2);color:var(--ink-2);font-weight:600}
.btn.done{background:var(--card-2);color:var(--good)}
.btn.danger{background:none;color:var(--danger);font-weight:600;border:1px solid var(--line)}
.btn.sm{padding:.55rem .8rem;font-size:.85rem;margin-top:.5rem}
.btn:active{opacity:.75}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.85rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .6rem;text-align:center}
.stat .v{font-family:var(--mono);font-size:1.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
.stat .k{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:.15rem;display:block}

.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-size:10px}
.chart .bar{fill:var(--accent)}
.chart .bar.empty{fill:var(--card-2)}
.chart .lbl{fill:var(--ink-2);font-size:10px;font-family:var(--mono);font-weight:600}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.55rem;font-size:.78rem;color:var(--ink-3);min-height:1.2rem}
.readout b{color:var(--ink);font-family:var(--mono);font-weight:700}

.day{margin-bottom:.85rem}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin:0 0 .4rem;padding:0 .15rem}
.day-n{font-size:.95rem;font-weight:800}
.day-m{font-size:.72rem;color:var(--ink-3);font-family:var(--mono)}
details.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:.4rem;overflow:hidden}
details.sess summary{list-style:none;cursor:pointer;padding:.72rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
details.sess summary::-webkit-details-marker{display:none}
.ss-name{font-size:.92rem;font-weight:600}
.ss-meta{font-size:.73rem;color:var(--ink-3);font-family:var(--mono);white-space:nowrap}
details.sess[open] summary{border-bottom:1px solid var(--line-2)}
.sess-body{padding:.2rem .9rem .8rem}

.field{display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line-2)}
.field:first-of-type{border-top:0}
.field label{font-size:.86rem;color:var(--ink-2)}
.field input,.field select{width:8rem;text-align:right;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:.4rem .55rem;font-family:var(--mono);font-size:.88rem}
.field input[type="text"],.field select{font-family:var(--sys)}
.field select{text-align:left;width:9.2rem}
.fullfield{padding:.55rem 0;border-top:1px solid var(--line-2)}
.fullfield label{display:block;font-size:.78rem;color:var(--ink-3);font-weight:600;margin-bottom:.3rem}
.fullfield input,.fullfield textarea{width:100%;background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;font-size:.9rem}
.fullfield textarea{min-height:6.5rem;resize:vertical;line-height:1.45}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tabbar);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:.5rem .2rem .55rem;display:flex;flex-direction:column;align-items:center;gap:.18rem;cursor:pointer;color:var(--ink-3)}
.tabs button[aria-pressed="true"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs span{font-size:.63rem;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;top:2.5rem;z-index:41;background:var(--sheet);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.85rem 1rem;border-bottom:1px solid var(--line);flex:none}
.sheet-t{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-x{background:none;border:0;color:var(--accent);font-weight:600;font-size:.92rem;cursor:pointer;padding:.2rem .1rem;white-space:nowrap}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom,0px))}
.detail{font-size:.93rem;color:var(--ink-2);line-height:1.6}
.detail p{margin:0 0 .8rem}
.detail p:last-child{margin-bottom:0}
.detail b{color:var(--ink);font-weight:700}
.metaline{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem}
.metaline span{font-family:var(--mono);font-size:.7rem;background:var(--card-2);color:var(--ink-2);padding:.2rem .45rem;border-radius:5px}

.exedit{border:1px solid var(--line);border-radius:11px;margin-bottom:.55rem;overflow:hidden;background:var(--card)}
.exedit-h{display:grid;grid-template-columns:1fr auto auto auto;gap:.3rem;align-items:center;padding:.55rem .5rem .55rem .7rem}
.exedit-n{font-size:.88rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:var(--card-2);border:1px solid var(--line);border-radius:7px;width:1.85rem;height:1.85rem;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:.85rem;font-weight:700;line-height:1}
.exedit-b{padding:.2rem .7rem .8rem;border-top:1px solid var(--line-2)}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;margin-bottom:.85rem}
.banner p{margin:0;font-size:.85rem;color:var(--ink)}
.empty{text-align:center;color:var(--ink-3);font-size:.85rem;padding:1.5rem .8rem}
.hide{display:none!important}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.rowbtns .btn{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="app">
  <div class="top">
    <div class="seg" id="segProfiles"></div>
    <h1 id="pageTitle">Hoy</h1>
    <p class="sub" id="pageSub"></p>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabbar"></div></nav>
<div id="overlay"></div>

<script>
(function(){
"use strict";

/* ==================== EJERCICIOS POR DEFECTO ==================== */
function X(id,name,sets,rest,eq,q,detail){
  return {id:id,name:name,sets:sets||'',rest:rest||'',eq:eq||'',q:q||name,detail:detail||'',media:''};
}

var CAL = "Nada suelto alternando 50 de crol y 50 de espalda. No busques ritmo: el objetivo es subir la temperatura, soltar el hombro y empezar a respirar largo. Si llegas al final del calentamiento con pulsaciones altas, has ido demasiado fuerte.";
var CALMA = "Muy suave, sin buscar velocidad. Sirve para bajar pulsaciones y para que el hombro no se quede cargado. Espalda es mejor que crol porque abre el pecho después de toda la sesión cerrándolo.";

function ejCal(id){return X(id,'Calentamiento · 200 m','','', '', 'calentamiento natacion crol espalda tecnica', CAL);}
function ejCalma(id,d){return X(id,'Vuelta a la calma · '+d,'','','', 'vuelta a la calma natacion espalda suave', CALMA);}

/* --- fichas de técnica --- */
var D_DESLIZ="<p><b>Montaje.</b> Con aletas, de frente, brazos estirados delante, una mano sobre la otra, mirada al fondo de la piscina.</p><p><b>Ejecución.</b> Das una brazada completa y te quedas totalmente estirado contando hasta dos antes de empezar la siguiente. El cuerpo tiene que quedar largo, como si alguien tirara de ti desde las manos.</p><p><b>Error típico.</b> Encadenar brazadas por ansiedad. Si no cuentas los dos segundos, el ejercicio no existe.</p><p><b>Qué debes notar.</b> Que avanzas durante la pausa. Si te hundes o te paras en seco, tu posición no es horizontal.</p>";
var D_66="<p><b>Montaje.</b> Con aletas. Empiezas nadando crol normal.</p><p><b>Ejecución.</b> Seis brazadas de crol, y a la sexta te quedas de costado: brazo de abajo estirado hacia delante, brazo de arriba pegado al muslo, mirada al fondo, pataleando seis veces. Luego seis brazadas más y cambias al otro lado.</p><p><b>Error típico.</b> Quedarse de costado con el hombro de arriba caído hacia atrás. El cuerpo se gira, pero el cuello no.</p><p><b>Qué debes notar.</b> Que la posición de costado es cómoda y avanzas. Es la posición sobre la que se construye toda la brazada de crol.</p>";
var D_BILAT="<p><b>Montaje.</b> Sin aletas, crol normal.</p><p><b>Ejecución.</b> Respiras cada tres brazadas, alternando lado. La clave está bajo el agua: suelta todo el aire por nariz y boca mientras la cara está sumergida, de forma continua, para que al girar solo tengas que coger aire.</p><p><b>Error típico.</b> Aguantar el aire y luego soltar y coger en el mismo medio segundo. Es la causa número uno de ahogarse nadando.</p><p><b>Qué debes notar.</b> Calma. Si cada tres brazadas te agobia, baja el ritmo antes que volver a respirar cada dos.</p>";
var D_PULL="<p><b>Montaje.</b> Pull-buoy entre los muslos, justo por encima de las rodillas. Las piernas no hacen nada: van juntas y quietas.</p><p><b>Ejecución.</b> Solo brazos. Mete la mano lejos, delante de la cabeza, y busca agarrar agua con el antebrazo manteniendo el codo alto. Tira hasta la cadera.</p><p><b>Error típico.</b> Entrar con la mano cerca de la cabeza y empujar hacia abajo, lo que te levanta en vez de moverte hacia delante.</p><p><b>Qué debes notar.</b> Carga en dorsal y hombro. Es el bloque que más trabaja el tren superior de toda la sesión.</p>";
var D_COSTADO="<p><b>Montaje.</b> Con aletas, de lado. Brazo de abajo estirado hacia delante, brazo de arriba pegado al muslo, oreja apoyada en el brazo estirado, mirada al fondo.</p><p><b>Ejecución.</b> Patada continua desde la cadera, rodilla casi recta y tobillo suelto. Respiras girando la cara hacia arriba sin sacar el hombro del agua. Cambias de lado en cada largo.</p><p><b>Error típico.</b> Patear desde la rodilla, como si dieras patadas a un balón. La patada nace de la cadera.</p><p><b>Qué debes notar.</b> El costado y el glúteo trabajando. Es el ejercicio con más retorno de todo el plan.</p>";
var D_ONDUL="<p><b>Montaje.</b> Con aletas, boca abajo, brazos estirados delante y cabeza entre los brazos.</p><p><b>Ejecución.</b> Ondulación continua: el movimiento nace del abdomen y la cadera y recorre el cuerpo hasta la aleta, como un látigo. Las rodillas se doblan poco y de forma pasiva.</p><p><b>Error típico.</b> Doblar mucho la rodilla y mover solo las piernas. Si el pecho no sube y baja un poco, no estás ondulando.</p><p><b>Qué debes notar.</b> Trabajo intenso en abdomen bajo, glúteo e isquiotibiales. Es lo más parecido a un ejercicio de cadera que existe dentro del agua.</p>";
var D_ONDCOST="<p><b>Montaje.</b> Igual que la ondulación, pero girada 90 grados: de lado, brazo de abajo estirado hacia delante.</p><p><b>Ejecución.</b> La misma ondulación, ahora en el plano lateral. Cuatro largos sobre un lado y cuatro sobre el otro.</p><p><b>Error típico.</b> Girar la cadera hasta quedarte casi boca abajo. Mantén el hombro de arriba apuntando al techo.</p><p><b>Qué debes notar.</b> Mucho más el lateral de la cadera que en la versión boca abajo. Es el bloque más específico de glúteo medio de la semana.</p>";
var D_VERT="<p><b>Montaje.</b> En la parte honda, pegada al bordillo o a la corchera, con aletas. Cuerpo vertical, brazos cruzados sobre el pecho.</p><p><b>Ejecución.</b> Ondulación continua, solo con las piernas, para mantenerte a flote con los hombros fuera del agua. Treinta segundos y descansas agarrada al bordillo.</p><p><b>Seguridad.</b> Hazlo siempre donde puedas agarrarte de inmediato. Si notas que te hundes, agárrate: no es un ejercicio de aguantar.</p><p><b>Qué debes notar.</b> Glúteo, cuádriceps y core a tope. Es de lo más exigente que se puede hacer en una piscina.</p>";
var D_ESPALDA="<p><b>Montaje.</b> Con aletas, boca arriba, brazos estirados por encima de la cabeza o pegados al cuerpo. Cadera alta, cerca de la superficie.</p><p><b>Ejecución.</b> Patada continua desde la cadera. Las rodillas no deben salir del agua: si salen, estás pedaleando.</p><p><b>Error típico.</b> Sentarse, con la cadera hundida y las rodillas fuera. Mete el ombligo y saca el pecho.</p><p><b>Qué debes notar.</b> Es la posición que más carga la extensión de cadera, es decir, el glúteo.</p>";
var D_BORDILLO="<p><b>Montaje.</b> De pie en la parte poco profunda, agarrada al bordillo con las dos manos, cuerpo erguido.</p><p><b>Ejecución.</b> Por pierna: 15 patadas llevando la pierna recta hacia atrás y 15 llevándola hacia el lado. Rápidas, porque la resistencia del agua sube con la velocidad.</p><p><b>Aviso honesto.</b> Esto es trabajo accesorio, no un constructor de músculo: la flotación reduce mucho la carga. Suma, pero no sustituye al trabajo con peso.</p>";
var D_PROG="<p><b>Ejecución.</b> Cada largo empieza suave y acaba fuerte, subiendo de forma progresiva. No es nadar rápido: es aprender a cambiar de marcha.</p><p><b>Para qué sirve.</b> Prepara el cuerpo para las series duras que vienen después sin gastarte antes de tiempo.</p>";
var D_FUERTE="<p><b>Ejecución.</b> Cada 25 a tope. La referencia es que llegues a la pared sin poder hablar, respirando por la boca.</p><p><b>Regla de calidad.</b> Si a partir del octavo la brazada se te descompone y empiezas a bracear corto y rápido, alarga el descanso a 45 segundos. Es preferible hacer menos repeticiones bien que todas mal.</p><p><b>Para qué sirve.</b> Es el bloque de mayor gasto calórico de la semana.</p>";

var DAYN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DAYS=['D','L','M','X','J','V','S'];
var EFFORT={suave:{m:.85,l:'Suave'},normal:{m:1,l:'Normal'},fuerte:{m:1.15,l:'Fuerte'}};
var METS=[{v:5.8,l:'Suave'},{v:6.5,l:'Moderada'},{v:7.5,l:'Firme'},{v:8.5,l:'Fuerte'}];
var EQL={'':'sin material',f:'aletas',p:'pull-buoy'};
var DEFAULTS={a:{name:'Isra',heightCm:178,weightKg:80,accent:'teal'},b:{name:'Ella',heightCm:165,weightKg:57,accent:'plum'}};

/* ==================== HELPERS ==================== */
function iso(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10);}
function today(){return iso(new Date());}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function mondayOf(d){var x=new Date(d.getTime());return addDays(x,-((x.getDay()+6)%7));}
function daysBetween(a,b){return Math.round((b-a)/864e5);}
function kcalOf(met,kg,min,eff){return Math.round(met*(EFFORT[eff]||EFFORT.normal).m*kg*(min/60));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(v,f){v=parseFloat(v);return isFinite(v)?v:f;}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ytSearch(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}

/* ==================== ALMACENAMIENTO ==================== */
var LK='doscalles-v1';
function localData(){try{var d=JSON.parse(localStorage.getItem(LK)||'{}')||{};return d;}catch(e){return {};}}
function localSave(d){try{localStorage.setItem(LK,JSON.stringify(d));}catch(e){}}
function D(){var x=localData();x.profiles=x.profiles||{};x.logs=x.logs||{};x.weights=x.weights||{};
  x.settings=x.settings||{};if(!x.routine)x.routine=DEFAULT_ROUTINE();return x;}

function saveRoutine(r){var x=D();x.routine=r;localSave(x);S.routine=r;}
function saveSettings(s){var x=D();x.settings=Object.assign({},x.settings,s);localSave(x);S.settings=x.settings;}
function saveProfile(id,obj){var x=D();x.profiles[id]=obj;localSave(x);S.profiles[id]=obj;}
function setLog(l){var x=D();x.logs[l.id]=l;localSave(x);reload();}
function delLog(id){var x=D();delete x.logs[id];localSave(x);reload();}
function setWeight(w){var x=D();x.weights[w.id]=w;localSave(x);reload();}

function exportBackup(){
  var d=D();d._app='dos-calles';d._v=2;d._exported=new Date().toISOString();
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='dos-calles-'+today()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}
function importBackup(file,done){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||d._app!=='dos-calles')throw new Error('formato');
      var cur=D();
      cur.profiles=Object.assign({},cur.profiles,d.profiles||{});
      cur.logs=Object.assign({},cur.logs,d.logs||{});
      cur.weights=Object.assign({},cur.weights,d.weights||{});
      cur.settings=Object.assign({},cur.settings,d.settings||{});
      if(d.routine)cur.routine=d.routine;
      localSave(cur);reload();
      done(null,Object.keys(d.logs||{}).length);
    }catch(e){done(e);}
  };
  r.onerror=function(){done(new Error('lectura'));};
  r.readAsText(file);
}

/* ==================== ESTADO ==================== */
var S={tab:'hoy',active:'a',profiles:{},logs:[],weights:[],routine:null,settings:{},form:{},pendingW:null,sheet:null};
try{var pr=localStorage.getItem(LK+'-me');if(pr==='a'||pr==='b')S.active=pr;}catch(e){}

function reload(){
  var x=D();
  S.profiles={a:Object.assign({},DEFAULTS.a,x.profiles.a||{}),b:Object.assign({},DEFAULTS.b,x.profiles.b||{})};
  S.logs=Object.keys(x.logs).map(function(k){var o=Object.assign({},x.logs[k]);o.id=k;return o;});
  S.weights=Object.keys(x.weights).map(function(k){var o=Object.assign({},x.weights[k]);o.id=k;return o;});
  S.routine=x.routine;S.settings=x.settings;
  render();
}
function prof(){return S.profiles[S.active]||DEFAULTS[S.active];}
function sessions(p){return (S.routine&&S.routine[p])||[];}
function sessionsOn(p,day){return sessions(p).filter(function(s){return s.day===day;});}
function findSession(p,id){var l=sessions(p);for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null;}
function logId(p,date,k){return p+'__'+date+'__'+k;}
function findLog(p,date,k){var id=logId(p,date,k);for(var i=0;i<S.logs.length;i++)if(S.logs[i].id===id)return S.logs[i];return null;}
function logsOf(p){return S.logs.filter(function(l){return l.profile===p;});}
function weightsOf(p){return S.weights.filter(function(w){return w.profile===p;}).sort(function(x,y){return x.date<y.date?-1:1;});}
function metLabel(v){for(var i=0;i<METS.length;i++)if(Math.abs(METS[i].v-v)<0.01)return METS[i].l;return 'Personal';}

/* ---------- HOY ---------- */
function reviewDue(){
  var w=num(S.settings.reviewWeeks,4);
  if(w<=0)return false;
  var last=S.settings.lastReview;
  if(!last){return false;}
  var d=daysBetween(new Date(last+'T00:00:00'),new Date());
  return d>=w*7;
}
function viewHoy(){
  var d=new Date(),day=d.getDay(),date=today();
  titleEl.textContent='Hoy';subEl.textContent=DAYN[day]+' · '+d.getDate()+'/'+(d.getMonth()+1);
  var list=sessionsOn(S.active,day),out='';

  if(!S.settings.lastReview)saveSettings({lastReview:today(),reviewWeeks:num(S.settings.reviewWeeks,4)});
  if(reviewDue()){
    out+='<div class="banner"><p><b>Toca revisar la rutina.</b> Han pasado '+num(S.settings.reviewWeeks,4)+
      ' semanas desde la última revisión. Sube repeticiones, acorta descansos o cambia algún ejercicio.</p>'+
      '<div class="rowbtns" style="margin-top:.7rem"><button class="btn sm" type="button" data-goplan="1">Ir a editar</button>'+
      '<button class="btn sm ghost" type="button" data-reviewed="1">Ya revisada</button></div></div>';
  }

  if(!list.length){
    var n=1;while(n<8&&!sessionsOn(S.active,(day+n)%7).length)n++;
    var nd=(day+n)%7,ns=sessionsOn(S.active,nd)[0];
    out+='<div class="card"><div class="hero-tag">Descanso</div><div class="hero-name">Hoy no toca</div>'+
      '<p class="muted">Día libre.'+(ns?' La próxima sesión es el '+DAYN[nd].toLowerCase()+': '+esc(ns.name).toLowerCase()+'.':'')+'</p></div>';
    return out+weightCard();
  }
  return out+list.map(function(s){return sessionCard(s,date);}).join('')+weightCard();
}

function sessionCard(s,date){
  var ex=findLog(S.active,date,s.id);
  var f=S.form[s.id]||(S.form[s.id]={min:ex?ex.minutes:s.min,eff:ex?ex.effort:'normal'});
  var kg=num(prof().weightKg,70),kc=kcalOf(s.met,kg,f.min,f.eff);
  var pills=['suave','normal','fuerte'].map(function(e){
    return '<button type="button" data-eff="'+e+'" data-k="'+s.id+'" aria-pressed="'+(f.eff===e)+'">'+EFFORT[e].l+'</button>';}).join('');
  return '<div class="card"><div class="hero-tag">Piscina</div>'+
    '<div class="hero-name">'+esc(s.name)+'</div>'+
    '<p class="muted">'+esc(s.dist||'')+' · unos '+s.min+' min · intensidad '+metLabel(s.met).toLowerCase()+'</p>'+
    exListHTML(s)+
    '<div style="margin-top:.9rem">'+
      '<div class="frow"><span class="flab">Minutos</span><div class="stepper">'+
        '<button type="button" data-min="-5" data-k="'+s.id+'" aria-label="Menos 5">−</button>'+
        '<span class="val">'+f.min+' min</span>'+
        '<button type="button" data-min="5" data-k="'+s.id+'" aria-label="Más 5">+</button></div></div>'+
      '<div class="frow"><span class="flab">Esfuerzo</span><div class="pills">'+pills+'</div></div></div>'+
    '<div class="kcal-line"><span class="muted">Gasto estimado</span><span><span class="kcal-num">'+kc+'</span><span class="kcal-unit">kcal</span></span></div>'+
    (ex?'<button class="btn done" type="button" data-undo="'+s.id+'">✓ Registrada · toca para deshacer</button>'
       :'<button class="btn" type="button" data-save="'+s.id+'">Registrar sesión</button>')+'</div>';
}

function weightBase(){
  var ws=weightsOf(S.active),last=ws.length?ws[ws.length-1]:null,t=today(),tw=null;
  for(var i=0;i<ws.length;i++)if(ws[i].date===t)tw=ws[i];
  return {tw:tw,kg:tw?tw.kg:(last?last.kg:num(prof().weightKg,70))};
}
function weightCard(){
  var wb=weightBase(),cur=S.pendingW!=null?S.pendingW:wb.kg;
  return '<div class="card"><p class="ctitle">Peso de hoy</p>'+
    '<div class="frow" style="border-top:0"><span class="flab">Kilos</span><div class="stepper">'+
      '<button type="button" data-wt="-0.1" aria-label="Menos">−</button>'+
      '<span class="val">'+cur.toFixed(1)+' kg</span>'+
      '<button type="button" data-wt="0.1" aria-label="Más">+</button></div></div>'+
    '<button class="btn ghost" type="button" data-savew="1">'+(wb.tw?'Actualizar peso de hoy':'Guardar peso de hoy')+'</button></div>';
}

/* ---------- PROGRESO ---------- */
function viewProg(){
  titleEl.textContent='Progreso';subEl.textContent=esc(prof().name);
  var ls=logsOf(S.active),mon=mondayOf(new Date()),days=[],total=0,count=0;
  for(var i=0;i<7;i++){
    var dt=iso(addDays(mon,i)),k=0;
    ls.forEach(function(l){if(l.date===dt){k+=l.kcal||0;count++;}});
    days.push({label:DAYS[addDays(mon,i).getDay()],k:k});total+=k;
  }
  return '<div class="stats">'+
    '<div class="stat"><span class="v">'+count+'</span><span class="k">sesiones</span></div>'+
    '<div class="stat"><span class="v">'+total+'</span><span class="k">kcal semana</span></div>'+
    '<div class="stat"><span class="v">'+streakOf(ls)+'</span><span class="k">semanas seguidas</span></div></div>'+
    '<div class="card"><p class="ctitle">Esta semana</p>'+barChart(days)+'<div class="readout"><span>Toca una barra para ver el detalle</span></div></div>'+
    '<div class="card"><p class="ctitle">Últimas 8 semanas</p>'+barChart(weeklyTotals(ls,8))+'<div class="readout"><span>Total por semana</span></div></div>'+
    weightChart()+
    '<div class="card"><p class="ctitle">Historial</p>'+historyHTML(ls)+'</div>';
}
function weeklyTotals(ls,n){
  var mon=mondayOf(new Date()),out=[];
  for(var w=n-1;w>=0;w--){
    var st=addDays(mon,-7*w),a=iso(st),b=iso(addDays(st,6)),k=0;
    ls.forEach(function(l){if(l.date>=a&&l.date<=b)k+=l.kcal||0;});
    out.push({label:st.getDate()+'/'+(st.getMonth()+1),k:k});
  }
  return out;
}
function streakOf(ls){
  var mon=mondayOf(new Date()),s=0,started=false;
  for(var w=0;w<60;w++){
    var st=addDays(mon,-7*w),a=iso(st),b=iso(addDays(st,6)),any=false;
    for(var i=0;i<ls.length;i++){if(ls[i].date>=a&&ls[i].date<=b){any=true;break;}}
    if(any){s++;started=true;}else if(w===0&&!started){continue;}else{break;}
  }
  return s;
}
function barChart(rows){
  var W=320,H=118,pB=20,pT=14,max=0;
  rows.forEach(function(r){if(r.k>max)max=r.k;});
  var sc=max||1,n=rows.length,gap=6,bw=(W-(n-1)*gap)/n,bars='',lab='';
  rows.forEach(function(r,i){
    var h=r.k>0?Math.max(4,(H-pB-pT)*(r.k/sc)):3,x=i*(bw+gap),y=H-pB-h;
    bars+='<rect class="bar'+(r.k>0?'':' empty')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" data-k="'+r.k+'" data-l="'+esc(r.label)+'"></rect>';
    lab+='<text class="axis" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto estimado por periodo">'+
    (max?'<text class="lbl" x="0" y="10">máx '+max+' kcal</text>':'')+
    '<line class="grid" x1="0" y1="'+(H-pB)+'" x2="'+W+'" y2="'+(H-pB)+'"/>'+bars+lab+'</svg>';
}
function weightChart(){
  var ws=weightsOf(S.active);
  if(ws.length<2)return '<div class="card"><p class="ctitle">Peso</p><div class="empty">Guarda el peso al menos dos días para ver la línea.</div></div>';
  var pts=ws.slice(-30),W=320,H=110,pT=12,pB=16,pL=48,pR=8,mn=Infinity,mx=-Infinity;
  pts.forEach(function(p){if(p.kg<mn)mn=p.kg;if(p.kg>mx)mx=p.kg;});
  if(mx-mn<1){mn-=.5;mx+=.5;}
  var sp=mx-mn;
  function Xc(i){return pL+(W-pL-pR)*(pts.length>1?i/(pts.length-1):0);}
  function Yc(v){return pT+(H-pT-pB)*(1-(v-mn)/sp);}
  var d=pts.map(function(p,i){return (i?'L':'M')+Xc(i).toFixed(1)+' '+Yc(p.kg).toFixed(1);}).join(' ');
  var f=pts[0],l=pts[pts.length-1],diff=l.kg-f.kg;
  return '<div class="card"><p class="ctitle">Peso · últimos '+pts.length+' registros</p>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del peso">'+
    '<line class="grid" x1="'+pL+'" y1="'+pT+'" x2="'+(W-pR)+'" y2="'+pT+'"/>'+
    '<line class="grid" x1="'+pL+'" y1="'+(H-pB)+'" x2="'+(W-pR)+'" y2="'+(H-pB)+'"/>'+
    '<text class="lbl" x="0" y="'+(pT+4)+'">'+mx.toFixed(1)+' kg</text>'+
    '<text class="lbl" x="0" y="'+(H-pB+4)+'">'+mn.toFixed(1)+' kg</text>'+
    '<path class="ln" d="'+d+'"/><circle class="pt" cx="'+Xc(pts.length-1).toFixed(1)+'" cy="'+Yc(l.kg).toFixed(1)+'" r="4.5"/></svg>'+
    '<div class="readout"><span>'+esc(f.date)+' → '+esc(l.date)+'</span><b>'+(diff>0?'+':'')+diff.toFixed(1)+' kg</b></div></div>';
}
function historyHTML(ls){
  var s=ls.slice().sort(function(x,y){return x.date<y.date?1:-1;}).slice(0,12);
  if(!s.length)return '<div class="empty">Todavía no hay sesiones registradas.</div>';
  return '<ul class="ex">'+s.map(function(l){
    return '<li style="padding:.5rem 0;display:flex;justify-content:space-between;gap:.7rem;align-items:baseline">'+
      '<span><span class="ex-n">'+esc(l.name)+'</span><span class="ex-d">'+esc(l.date)+' · '+l.minutes+' min · '+esc((EFFORT[l.effort]||EFFORT.normal).l.toLowerCase())+'</span></span>'+
      '<span class="ex-r">'+(l.kcal||0)+' kcal</span></li>';
  }).join('')+'</ul>';
}

function stripTags(h){
  if(!h)return '';
  return String(h).replace(/<\/p>\s*<p>/gi,'\n\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
}
function toHtml(t){
  if(!t)return '';
  return String(t).split(/\n{2,}/).map(function(p){
    return '<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>';
  }).join('');
}

  if((v=t.getAttribute('data-mv'))){
    var pmv=v.split('|'),smv=findSession(S.active,pmv[0]),i=+pmv[1],d=+pmv[2],j=i+d;
    if(smv&&j>=0&&j<smv.ex.length){

      saveRoutine(S.routine);document.getElementById('exList').innerHTML=editorExList(smv);

  if((v=t.getAttribute('data-exp'))){
    var pe=v.split('|'),el=document.getElementById('eb-'+pe[0]+'-'+pe[1]);

      ex2.sets=(g('sets')||'').trim().slice(0,40);

      ex2.eq=g('eq');

      ex2.q=(g('q')||'').trim().slice(0,120)||ex2.name;
      ex2.media=safeUrl(g('media'));
      saveRoutine(S.routine);
      document.getElementById('exList').innerHTML=editorExList(sx);

  if((v=t.getAttribute('data-delex'))){
    var pd=v.split('|'),sd=findSession(S.active,pd[0]);
    if(sd&&sd.ex.length>1){sd.ex.splice(+pd[1],1);saveRoutine(S.routine);
      document.getElementById('exList').innerHTML=editorExList(sd);}
    return;
  }
});

  }
  if(t.getAttribute('data-goplan')){S.tab='plan';render();window.scrollTo(0,0);return;}
  if(t.getAttribute('data-reviewed')){saveSettings({lastReview:today()});render();return;}

  if((v=t.getAttribute('data-min'))!==null&&v!==undefined&&t.hasAttribute('data-min')){

    return;

      minutes:ff.min,effort:ff.eff,kcal:kcalOf(s.met,kg,ff.min,ff.eff),weightKg:kg,ts:Date.now()});
    return;
  }
  if((v=t.getAttribute('data-undo'))){delLog(logId(S.active,today(),v));return;}

  if(t.hasAttribute('data-wt')){
    var base=S.pendingW!=null?S.pendingW:weightBase().kg;
    S.pendingW=Math.round(Math.max(30,Math.min(250,base+parseFloat(t.getAttribute('data-wt'))))*10)/10;
    render();return;
  }
  if(t.hasAttribute('data-savew')){
    var kgv=Math.round((S.pendingW!=null?S.pendingW:weightBase().kg)*10)/10;
    setWeight({id:S.active+'__'+today(),profile:S.active,date:today(),kg:kgv,ts:Date.now()});
    var pw=Object.assign({},prof());pw.weightKg=kgv;saveProfile(S.active,pw);
    S.pendingW=null;render();return;
  }
  if(t.hasAttribute('data-saveprofile')){
    var p2=Object.assign({},prof());
    p2.name=(document.getElementById('fName').value||'').trim().slice(0,18)||DEFAULTS[S.active].name;
    p2.heightCm=Math.round(Math.max(120,Math.min(230,num(document.getElementById('fH').value,170))));
    p2.weightKg=Math.round(Math.max(30,Math.min(250,num(document.getElementById('fW').value,70)))*10)/10;
    p2.accent=document.getElementById('fA').value==='plum'?'plum':'teal';
    saveProfile(S.active,p2);render();return;
  }
  if(t.hasAttribute('data-saverw')){
    saveSettings({reviewWeeks:parseInt(document.getElementById('fRW').value,10)||0,lastReview:today()});
    render();return;
  }
  if(t.hasAttribute('data-export')){exportBackup();
    var m0=document.getElementById('ioMsg');if(m0)m0.textContent='Copia generada. Guárdala en Archivos o iCloud Drive.';return;}
  if(t.hasAttribute('data-import')){
    var fi=document.getElementById('fileIn');if(!fi)return;
    fi.onchange=function(){
      if(!fi.files||!fi.files[0])return;
      importBackup(fi.files[0],function(err,n){
        var m=document.getElementById('ioMsg');
        if(err){if(m)m.textContent='No se pudo leer el fichero. ¿Es una copia de esta app?';return;}
        var m2=document.getElementById('ioMsg');if(m2)m2.textContent='Restauradas '+n+' sesiones.';
      });
    };
    fi.click();return;
  }
  if(t.hasAttribute('data-resetroutine')){
    saveRoutine(DEFAULT_ROUTINE());render();
    return;
  }
});

/* ==================== ARRANQUE ==================== */
reload();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
</script>

</html>
